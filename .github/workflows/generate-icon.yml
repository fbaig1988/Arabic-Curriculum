name: Generate App Icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

jobs:
  build-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Binary PNG
        run: |
          node -e "
          const fs = require('fs');
          const b64 = '';
          fs.writeFileSync('apple-touch-icon.png', Buffer.from(b64, 'base64'));
          "

      - name: Commit Image File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add apple-touch-icon.png
          git commit -m "Auto-generate genuine apple-touch-icon.png binary" || exit 0
          git push
