name: Generate App Icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-icon.yml'

jobs:
  build-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Renderer & Generate Icon
        run: |
          npm install @resvg/resvg-js
          node -e "
          const { Resvg } = require('@resvg/resvg-js');
          const fs = require('fs');

          const svg = \`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
            <defs>
              <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
                <stop offset='0%' stop-color='#022c22'/>
                <stop offset='55%' stop-color='#064e3b'/>
                <stop offset='100%' stop-color='#01140f'/>
              </linearGradient>
              <linearGradient id='gold' x1='0%' y1='0%' x2='100%' y2='90%'>
                <stop offset='0%' stop-color='#fef08a'/>
                <stop offset='35%' stop-color='#f59e0b'/>
                <stop offset='100%' stop-color='#b45309'/>
              </linearGradient>
              <radialGradient id='halo' cx='50%' cy='52%' r='48%'>
                <stop offset='0%' stop-color='#f59e0b' stop-opacity='0.45'/>
                <stop offset='65%' stop-color='#10b981' stop-opacity='0.12'/>
                <stop offset='100%' stop-color='#000000' stop-opacity='0'/>
              </radialGradient>
            </defs>
            <rect width='512' height='512' rx='115' fill='url(#bg)'/>
            <circle cx='256' cy='270' r='210' fill='url(#halo)'/>
            <rect x='32' y='32' width='448' height='448' rx='88' fill='none' stroke='url(#gold)' stroke-width='4' stroke-opacity='0.45'/>
            <rect x='46' y='46' width='420' height='420' rx='76' fill='none' stroke='url(#gold)' stroke-width='2' stroke-dasharray='10 6' stroke-opacity='0.6'/>
            <path d='M135 415 L135 250 C135 125 377 125 377 250 L377 415' fill='none' stroke='url(#gold)' stroke-width='12' stroke-linecap='round'/>
            <path d='M160 415 L160 255 C160 160 352 160 352 255 L352 415' fill='#031b15' fill-opacity='0.75' stroke='url(#gold)' stroke-width='3' stroke-opacity='0.8'/>
            <polygon points='256,76 264,96 286,96 268,108 275,128 256,116 237,128 244,108 226,96 248,96' fill='#fef08a'/>
            <line x1='100' y1='415' x2='412' y2='415' stroke='url(#gold)' stroke-width='10' stroke-linecap='round'/>
            <text x='256' y='352' font-size='200' font-family='Arial, sans-serif' font-weight='bold' fill='url(#gold)' text-anchor='middle'>&#1604;</text>
          </svg>\`;

          const resvg = new Resvg(svg, { fitTo: { mode: 'width', value: 512 } });
          const pngData = resvg.render();
          fs.writeFileSync('apple-touch-icon.png', pngData.asPng());
          "

      - name: Commit Real PNG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add apple-touch-icon.png
          git commit -m "Generate actual Sanctuary Arch apple-touch-icon.png" || exit 0
          git push
